name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest

    env:
      # CI never touches a database. These are placeholders that satisfy the
      # environment check in lib/env.ts so the build resolves; nothing more.
      # See docs/05-OPS.md.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The secret key bypasses row-level security completely, and a key that
      # has reached one browser has to be rotated. docs/05-OPS.md.
      - name: Secret key is not reachable from client code
        run: npm run check:secrets

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
